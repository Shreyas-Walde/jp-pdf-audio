# Railway deployment configuration
# Using Dockerfile for build

[build]
# Use Dockerfile instead of Nixpacks
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Health check
healthcheckPath = "/"
healthcheckTimeout = 300

# Number of instances
numReplicas = 1

[env]
# Node environment
NODE_ENV = "production"
# Port (Railway sets this automatically)
PORT = { default = "3000" }
